<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseTap Visualizer</title>
  <link rel="stylesheet" href="visualizer.css" />
</head>
<body>

  <!-- ── Join overlay ──────────────────────────────────────── -->
  <div id="joinOverlay" class="join-overlay">
    <div class="join-card">
      <div class="join-logo">PulseTap</div>
      <p class="join-sub">Visualizer Mode</p>
      <input id="vizRoomCode" class="join-input" type="text"
             placeholder="ROOM CODE" maxlength="8" autocomplete="off" />
      <button id="joinVizBtn" class="join-btn">Connect</button>
      <button id="rehearsalModeBtn" class="join-btn rehearsal-btn">Rehearsal Mode</button>
      <p id="joinError" class="join-error hidden"></p>
    </div>
  </div>

  <!-- ── Main visualizer canvas ────────────────────────────── -->
  <div id="vizCanvas" class="viz-canvas hidden">

    <!-- Beat pulse ring -->
    <div id="beatRing" class="beat-ring"></div>

    <!-- Top meta bar -->
    <header class="viz-meta">
      <span class="meta-item" id="vizRoom">ROOM —</span>
      <span class="meta-sep">·</span>
      <span class="meta-item"><span id="vizBpm">—</span> BPM</span>
      <span class="meta-sep">·</span>
      <span class="meta-item" id="vizKey">— —</span>
      <span class="meta-sep">·</span>
      <span class="meta-item" id="vizTimeSig">—/4</span>
      <span class="meta-sep meta-right-push"></span>
      <span class="meta-item meta-status" id="vizStatus">Waiting…</span>
    </header>

    <!-- Centre stage -->
    <main class="viz-stage">

      <!-- Upcoming label (top) -->
      <div class="stage-upcoming-wrap">
        <span class="upcoming-label">NEXT</span>
        <span id="vizUpcoming" class="upcoming-text">—</span>
      </div>

      <!-- Current section (hero) -->
      <div class="stage-hero">
        <div id="vizSection" class="hero-section">—</div>
        <div id="vizSlot" class="hero-slot">Slot —</div>
      </div>

      <!-- Transition countdown -->
      <div id="vizCountdown" class="stage-countdown hidden">
        <span id="vizCountdownText">— IN — BARS</span>
      </div>

      <!-- Bars remaining -->
      <div id="vizBarsWrap" class="stage-bars hidden">
        <div class="bars-label">BARS REMAINING</div>
        <div id="vizBarsRemaining" class="bars-value">—</div>
        <div id="vizBarsTrack" class="bars-track">
          <!-- filled dynamically -->
        </div>
      </div>

    </main>

    <!-- Energy meter (bottom) -->
    <footer class="viz-footer">
      <div class="energy-wrap">
        <span class="energy-label">ENERGY</span>
        <div class="energy-bar">
          <div id="energyFill" class="energy-fill"></div>
        </div>
        <span id="energyLevel" class="energy-level">—</span>
      </div>

      <!-- Beat dots -->
      <div id="vizBeatBar" class="viz-beat-bar"></div>
    </footer>

  </div><!-- /vizCanvas -->
  <!-- ── Rehearsal Mode panel ──────────────────────────────── -->
  <div id="rehearsalPanel" class="rehearsal-panel hidden">
    <header class="rh-header">
      <div class="rh-logo">PulseTap</div>
      <span class="rh-title">Rehearsal Mode</span>
      <button id="rhCloseBtn" class="rh-close-btn" title="Close Rehearsal Mode">✕</button>
    </header>
    <!-- Session meta -->
    <div class="rh-meta-bar">
      <div class="rh-meta-chip"><span class="rh-chip-label">TITLE</span><span id="rhTitle" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">BPM</span><span id="rhBpm" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">KEY</span><span id="rhKey" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">MODE</span><span id="rhMode" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">TIME SIG</span><span id="rhTimeSig" class="rh-chip-value">—</span></div>
    </div>
    <!-- Section list -->
    <div class="rh-section-list" id="rhSectionList">
      <!-- populated by JS -->
    </div>
    <!-- Load from room / manual entry -->
    <div class="rh-load-bar">
      <input id="rhRoomCode" class="rh-room-input" type="text" placeholder="ROOM CODE (optional)" maxlength="8" />
      <button id="rhLoadBtn" class="rh-load-btn">Load from Room</button>
      <span id="rhLoadStatus" class="rh-load-status"></span>
    </div>
    <!-- Arrangement notes -->
    <div class="rh-notes-wrap">
      <label class="rh-notes-label">Arrangement Notes</label>
      <textarea id="rhArrangementNotes" class="rh-notes-area" placeholder="Overall arrangement notes…" rows="3"></textarea>
    </div>
  </div><!-- /rehearsalPanel -->

  <script src="/socket.io/socket.io.js"></script>
  <script src="visualizer.js"></script>
</body>
</html>
