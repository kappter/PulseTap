<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseTap Visualizer</title>
  <link rel="stylesheet" href="visualizer.css" />
</head>
<body>

  <!-- ── Join overlay ──────────────────────────────────────── -->
  <div id="joinOverlay" class="join-overlay">
    <div class="join-card">
      <div class="join-logo">PulseTap</div>
      <p class="join-sub">Visualizer Mode</p>
      <input id="vizRoomCode" class="join-input" type="text"
             placeholder="ROOM CODE" maxlength="8" autocomplete="off" />
      <button id="joinVizBtn" class="join-btn">Connect</button>
      <button id="rehearsalModeBtn" class="join-btn rehearsal-btn">Rehearsal Mode</button>
      <p id="joinError" class="join-error hidden"></p>
    </div>
  </div>

  <!-- ── Main visualizer canvas ──────────────────────────────────────────────── -->
  <div id="vizCanvas" class="viz-canvas hidden">
    <!-- Beat pulse ring (behind everything) -->
    <div id="beatRing" class="beat-ring"></div>

    <!-- ── Top meta bar — mode switcher lives here, right-aligned ── -->
    <header class="viz-meta">
      <span class="meta-item" id="vizRoom">ROOM —</span>
      <span class="meta-sep">·</span>
      <span class="meta-item"><span id="vizBpm">—</span> BPM</span>
      <span class="meta-sep">·</span>
      <span class="meta-item" id="vizKey">— —</span>
      <span class="meta-sep">·</span>
      <span class="meta-item" id="vizTimeSig">—/4</span>
      <span class="meta-sep meta-right-push"></span>
      <span class="meta-item meta-status" id="vizStatus">Waiting…</span>
      <!-- Mode switcher: inline in header, no absolute positioning -->
      <div id="modeSwitcher" class="mode-switcher">
        <button id="modeLiveBtn"     class="mode-btn mode-btn-active">⬡ Live</button>
        <button id="modePlaybackBtn" class="mode-btn">▶ Playback</button>
      </div>
    </header>

    <!-- ── Playback transport row (own grid row, shown only in Playback Mode) ── -->
    <div id="playbackControls" class="playback-controls hidden">
      <button id="pbRestartBtn" class="pb-btn" title="Restart">⏮</button>
      <button id="pbPlayBtn"    class="pb-btn pb-play" title="Play/Pause">▶</button>
      <button id="pbSlowerBtn"  class="pb-btn" title="Slower">−</button>
      <span   id="pbBpmDisplay" class="pb-bpm-display">120 BPM</span>
      <button id="pbFasterBtn"  class="pb-btn" title="Faster">+</button>
      <input  id="pbBpmSlider"  class="pb-bpm-slider" type="range" min="40" max="240" value="120" />
      <button id="pbImportBtn"  class="pb-btn pb-io-btn" title="Import Arrangement">⬆ Import</button>
      <button id="pbExportBtn"  class="pb-btn pb-io-btn" title="Export Arrangement">⬇ Export</button>
    </div>

    <!-- ── Part Timeline Strip (own grid row) ────────────────────────────────────── -->
    <div id="partTimeline" class="part-timeline hidden">
      <canvas id="timelineCanvas" class="timeline-canvas"></canvas>
      <div    id="timelinePlayhead" class="timeline-playhead"></div>
    </div>

    <!-- Centre stage -->
    <main class="viz-stage">

      <!-- Upcoming label (top) -->
      <div class="stage-upcoming-wrap">
        <span class="upcoming-label">NEXT</span>
        <span id="vizUpcoming" class="upcoming-text">—</span>
      </div>

      <!-- Current section (hero) -->
      <div class="stage-hero">
        <div id="vizSection" class="hero-section">—</div>
        <div id="vizSlot" class="hero-slot">Slot —</div>
      </div>

      <!-- Transition countdown -->
      <div id="vizCountdown" class="stage-countdown hidden">
        <span id="vizCountdownText">— IN — BARS</span>
      </div>

      <!-- Bars remaining -->
      <div id="vizBarsWrap" class="stage-bars hidden">
        <div class="bars-label">BARS REMAINING</div>
        <div id="vizBarsRemaining" class="bars-value">—</div>
        <div id="vizBarsTrack" class="bars-track">
          <!-- filled dynamically -->
        </div>
      </div>

    </main>


    <!-- ── Musician Reference Panel (Rehearsal Mode) ────────── -->
    <div id="vizRefPanel" class="viz-ref-panel hidden">
      <div class="ref-header">MUSICIAN REFERENCE</div>
      <div class="ref-content">
        <div class="ref-col">
          <div class="ref-label">SCALE NOTES</div>
          <div id="refScaleNotes" class="ref-value scale-notes">—</div>
        </div>
        <div class="ref-col piano-col">
          <div class="ref-label">PIANO</div>
          <div id="refPianoMap" class="piano-map"></div>
        </div>
        <div class="ref-col guitar-col">
          <div class="ref-label">GUITAR (Standard E)</div>
          <div id="refGuitarMap" class="guitar-map"></div>
        </div>
      </div>
    </div>
    
    <!-- Energy meter (bottom) -->
    <footer class="viz-footer">
      <div class="energy-wrap">
        <span class="energy-label">ENERGY</span>
        <div class="energy-bar">
          <div id="energyFill" class="energy-fill"></div>
        </div>
        <span id="energyLevel" class="energy-level">—</span>
      </div>

      <!-- Beat dots -->
      <div id="vizBeatBar" class="viz-beat-bar"></div>
    </footer>

  </div><!-- /vizCanvas -->
  <!-- ── Rehearsal Mode panel ──────────────────────────────── -->
  <div id="rehearsalPanel" class="rehearsal-panel hidden">
    <header class="rh-header">
      <div class="rh-logo">PulseTap</div>
      <span class="rh-title">Rehearsal Mode</span>
      <button id="rhCloseBtn" class="rh-close-btn" title="Close Rehearsal Mode">✕</button>
    </header>
    <!-- Session meta -->
    <div class="rh-meta-bar">
      <div class="rh-meta-chip">
        <span class="rh-chip-label">ROLE</span>
        <select id="rhRoleSelect" class="rh-role-select">
          <option value="All">All Roles</option>
          <option value="Melody">Melody</option>
          <option value="Bass">Bass</option>
          <option value="Percussion">Percussion</option>
          <option value="Chords">Chords</option>
          <option value="FX">FX</option>
        </select>
      </div>
      <div class="rh-meta-chip"><span class="rh-chip-label">TITLE</span><span id="rhTitle" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">BPM</span><span id="rhBpm" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">KEY</span><span id="rhKey" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">MODE</span><span id="rhMode" class="rh-chip-value">—</span></div>
      <div class="rh-meta-chip"><span class="rh-chip-label">TIME SIG</span><span id="rhTimeSig" class="rh-chip-value">—</span></div>
    </div>
    <!-- Section list -->
    <div class="rh-section-list" id="rhSectionList">
      <!-- populated by JS -->
    </div>
    <!-- Load from room / manual entry -->
    <div class="rh-load-bar">
      <input id="rhRoomCode" class="rh-room-input" type="text" placeholder="ROOM CODE (optional)" maxlength="8" />
      <button id="rhLoadBtn" class="rh-load-btn">Load from Room</button>
      <span id="rhLoadStatus" class="rh-load-status"></span>
    </div>
    <!-- Arrangement notes -->
    <div class="rh-notes-wrap">
      <label class="rh-notes-label">Arrangement Notes</label>
      <textarea id="rhArrangementNotes" class="rh-notes-area" placeholder="Overall arrangement notes…" rows="3"></textarea>
    </div>
  </div><!-- /rehearsalPanel -->

  <!-- ── Import/Export Arrangement Modal ──────────────────── -->
  <div id="ioModal" class="io-modal hidden">
    <div class="io-modal-card">
      <div class="io-modal-header">
        <span id="ioModalTitle" class="io-modal-title">Import Arrangement</span>
        <button id="ioModalClose" class="io-modal-close">✕</button>
      </div>
      <textarea id="ioModalTextarea" class="io-modal-textarea"
                placeholder='Paste arrangement JSON here…' rows="14"></textarea>
      <div class="io-modal-actions">
        <button id="ioModalConfirm" class="io-modal-confirm">Load</button>
        <button id="ioModalCopy"    class="io-modal-copy hidden">Copy to Clipboard</button>
        <span   id="ioModalStatus"  class="io-modal-status"></span>
      </div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="visualizer.js"></script>
</body>
</html>
